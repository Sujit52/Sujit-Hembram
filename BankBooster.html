
<!DOCTYPE html>
<html>
<head>
	<title>Website Suspended</title>
	<style>
		body {
			background-color: #f2f2f2;
			font-family: Arial, sans-serif;
			text-align: center;
		}
		
		.container {
			width: 80%;
			margin: 40px auto;
			background-color: #fff;
			padding: 20px;
			border: 1px solid #ddd;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0,0,0,0.1);
		}
		
		.icon {
			font-size: 100px;
			color: #ff0000;
			margin-bottom: 20px;
		}
		
		.message {
			font-size: 24px;
			color: #333;
			margin-bottom: 20px;
		}
		
		.description {
			font-size: 18px;
			color: #666;
			margin-bottom: 20px;
		}
	</style>
</head>
<body>
	<div class="container">
		<i class="icon fas fa-ban"></i>
		<div class="message">Website Suspended</div>
		<div class="description">This website has been suspended due to unusual activity. Please contact the site administrator for more information.</div>
	</div>
</body>
</html>
